name: Chronological allocation diagnostic
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-reproduce.txt
      - run: python -m pytest -q
      - run: python reproduce_chronological.py
      - uses: actions/upload-artifact@v4
        with:
          name: chronological-results
          path: results/chronological
